spec_version: "0.1"
name: corpus_cache_embeddings
status: draft
description: Local embedding profiles accepted by semantic indexing commands.

profiles:
  - name: model2vec_potion_base_32m
    provider: model2vec
    model_name: minishlab/potion-base-32M
    dimension: null
    speed_tier: static_fastest
    benchmark_rating: baseline_static
    description: Very high-throughput local draft profile and low-resource test option.
  - name: fastembed_bge_small_en_v1_5
    provider: fastembed
    model_name: BAAI/bge-small-en-v1.5
    dimension: 384
    speed_tier: fast
    benchmark_rating: strong_small
    description: Default candidate for folder-scale local indexing.
  - name: sentence_transformers_bge_base_en_v1_5
    provider: sentence_transformers
    model_name: BAAI/bge-base-en-v1.5
    dimension: 768
    speed_tier: higher_quality_slower
    benchmark_rating: stronger_base
    description: Higher-quality local pass for smaller or more important scopes.
