spec_version: "0.1"
name: evidence_engine_exposures
status: draft
description: >
  Backend exposure and storage settings for generated evidence-engine outputs.
  These settings are configuration, not SQLite catalog tables.

workspace_storage_root:
  path_template: ".documents-manager"
  configurable: false
  description: >
    The generated storage root is relative to the caller workspace. Commands
    must not default to a shared home-cache result/report location.

exposure_kinds:
  - name: sqlite
    description: Primary local metadata and control database.
  - name: file
    description: Filesystem artifact addressed from SQLite by relative URI.
  - name: fts
    description: Full-text index directory managed by this CLI.
  - name: semantic
    description: Vector store directory managed by this CLI.

workspace_root_layout:
  - name: catalog
    exposure: sqlite
    path_template: "catalog/catalog.sqlite"
    description: Current-state SQLite catalog.
  - name: blobs
    exposure: file
    path_template: "blobs/{yyyy}/{mm}/{sha256_prefix}/{sha256}"
    description: External artifact payloads above the blob threshold.
  - name: fts
    exposure: fts
    path_template: "fts/{fts_profile}/{scope_id}/"
    description: Full-text index island for one scope/profile.
  - name: semantic
    exposure: semantic
    path_template: "semantic/{embedding_profile}/{scope_id}.lancedb/"
    description: Vector store island for one scope/profile.
  - name: embedding_models
    exposure: file
    path_template: "models/fastembed/"
    description: Local FastEmbed model cache used by semantic indexing commands.
  - name: results
    exposure: file
    path_template: "results/{yyyy}.{mm}/{dd}/{hhmmss}-{command}/"
    description: Command result JSON, events, logs, and Markdown summaries.
  - name: reports
    exposure: file
    path_template: "reports/{yyyy}.{mm}/{dd}/{hhmmss}-{command}/"
    description: Optional on-demand HTML analytics reports generated from command results.

storage_profiles:
  - name: default_artifact_blobs
    description: Small payloads are inline SQLite blobs; large payloads spill to hash-addressed files.
    hash_algorithm: sha256
    external_threshold_bytes: 524288
    inline_compression_min_bytes: 32768
    inline_compression: zstd
    compressible_extensions: [txt, md, json, csv, tsv, yaml, yml, html, xml]
