[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documents-manager"
version = "0.1.0"
description = "Reusable local evidence engine for documents and generic media."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "VectorMind" },
]
dependencies = [
  "orjson",
  "pydantic",
  "PyYAML",
  "rich",
  "typer",
  "zstandard",
]

[project.scripts]
documents-manager = "documents_manager.cli:main"

[project.optional-dependencies]
docling = [
  "docling",
]
fts = [
  "tantivy",
]
semantic = [
  "lancedb",
  "numpy",
  "pyarrow",
]
embeddings = [
  "fastembed",
]
heavy-embeddings = [
  "sentence-transformers",
]
all = [
  "docling",
  "fastembed",
  "lancedb",
  "numpy",
  "pyarrow",
  "sentence-transformers",
  "tantivy",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/documents_manager"]

[tool.hatch.build.targets.wheel.force-include]
"catalog.yaml" = "documents_manager/contracts/catalog.yaml"
"config/embeddings.yaml" = "documents_manager/contracts/config/embeddings.yaml"
"config/exposures.yaml" = "documents_manager/contracts/config/exposures.yaml"
"config/parser.yaml" = "documents_manager/contracts/config/parser.yaml"
"store_templates.yaml" = "documents_manager/contracts/store_templates.yaml"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
