spec_version: "0.1"
name: corpus_cache_store_templates
status: draft
description: >
  Lower-index row templates for generated search islands. These templates are
  not SQLite catalog tables. Catalog objects are the master records; chunks
  reference master objects only inside FTS and semantic stores.

templates:
  - name: fts_chunk_document
    backend: fts
    description: One generated FTS document per indexing chunk.
    columns:
      - {name: chunk_id, type: text, description: "Generated chunk/search-unit ID."}
      - {name: doc_id, type: text, description: "Owning catalog document ID."}
      - {name: object_id, type: text, description: "Primary catalog object represented by the chunk."}
      - {name: scope_id, type: text, description: "Catalog index scope."}
      - {name: chunk_profile, type: text, description: "Chunking profile used to generate the row."}
      - {name: content_type, type: enum, description: "Index content type.", values: [plain_text, paragraph, section, table, codeblock, formula, figure_caption, image_caption, chart_summary, mixed]}
      - {name: page_start, type: integer, description: "First page covered by the chunk."}
      - {name: page_end, type: integer, description: "Last page covered by the chunk."}
      - {name: title, type: text, description: "Title field for BM25."}
      - {name: heading_path, type: text, description: "Heading path field for BM25 and display."}
      - {name: body, type: text, description: "Main searchable text."}
      - {name: metadata_json, type: json, description: "Compact filter and provenance metadata."}

  - name: fts_summary_node
    backend: fts
    description: One generated FTS document per current summary node.
    columns:
      - {name: summary_id, type: text, description: "Catalog summary node ID."}
      - {name: root_id, type: text, description: "Summarized source root."}
      - {name: scope_id, type: text, description: "Summarized index scope."}
      - {name: kind, type: enum, description: "Summary node kind."}
      - {name: modality, type: enum, description: "Dominant modality."}
      - {name: title, type: text, description: "Display title."}
      - {name: summary_text, type: text, description: "Lossy summary text."}
      - {name: routing_payload, type: text, description: "Primary searchable payload derived from summary_text + routing_meta (RP1)."}
      - {name: source_refs_json, type: json, description: "Represented lower evidence refs."}
      - {name: metadata_json, type: json, description: "Compact route metadata."}

  - name: semantic_summary_node
    backend: semantic
    description: One generated semantic row per current summary node (global representative).
    columns:
      - {name: summary_id, type: text, description: "Catalog summary node ID."}
      - {name: root_id, type: text, description: "Summarized source root."}
      - {name: scope_id, type: text, description: "Summarized index scope."}
      - {name: kind, type: enum, description: "Summary node kind."}
      - {name: modality, type: enum, description: "Dominant modality."}
      - {name: embedding_profile, type: text, description: "Embedding profile used for this row."}
      - {name: vector, type: vector, description: "Dense embedding of routing_payload."}
      - {name: title, type: text, description: "Display title."}
      - {name: routing_payload, type: text, description: "Text embedded for semantic routing (summary_text + routing_meta)."}
      - {name: source_refs_json, type: json, description: "Represented lower evidence refs."}
      - {name: metadata_json, type: json, description: "Compact route metadata (root_label, importance)."}

  - name: siglip_summary_node
    backend: semantic
    description: >
      One generated SigLIP-space row per album medoid (global media representative).
      Vectors are reused from the per-scope image proof store, never re-embedded.
      Separate space per image profile; never mixed with text vectors (S3).
    columns:
      - {name: summary_id, type: text, description: "Owning album_summary node ID."}
      - {name: root_id, type: text, description: "Summarized source root."}
      - {name: scope_id, type: text, description: "Summarized index scope (album)."}
      - {name: asset_id, type: text, description: "Medoid image asset ID."}
      - {name: image_profile, type: text, description: "SigLIP image profile used for this row."}
      - {name: vector, type: vector, description: "Reused SigLIP image vector of the medoid asset."}
      - {name: modality, type: enum, description: "Dominant modality (image)."}
      - {name: title, type: text, description: "Display title (album)."}
      - {name: relative_path, type: text, description: "Medoid asset relative path."}
      - {name: metadata_json, type: json, description: "Compact route metadata (root_label, importance)."}

  - name: semantic_chunk_row
    backend: semantic
    description: One generated semantic row per indexing chunk.
    columns:
      - {name: chunk_id, type: text, description: "Generated chunk/search-unit ID."}
      - {name: doc_id, type: text, description: "Owning catalog document ID."}
      - {name: object_id, type: text, description: "Primary catalog object represented by the chunk."}
      - {name: scope_id, type: text, description: "Catalog index scope."}
      - {name: embedding_profile, type: text, description: "Embedding profile used for this row."}
      - {name: chunk_profile, type: text, description: "Chunking profile used to generate the row."}
      - {name: vector, type: vector, description: "Dense embedding vector."}
      - {name: text, type: text, description: "Text embedded for semantic search."}
      - {name: content_type, type: enum, description: "Index content type.", values: [plain_text, paragraph, section, table, codeblock, formula, figure_caption, image_caption, chart_summary, mixed]}
      - {name: page_start, type: integer, description: "First page covered by the chunk."}
      - {name: page_end, type: integer, description: "Last page covered by the chunk."}
      - {name: metadata_json, type: json, description: "Compact filter and provenance metadata."}
