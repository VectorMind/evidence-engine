spec_version: "0.8"
name: corpus_cache_catalog
status: draft
description: >
  Public SQLite catalog schema for current evidence-engine metadata. The catalog
  stores source inventory, current document parse state, Docling artifacts,
  normalized document objects, valuable items, and pointers to lower FTS and
  semantic index islands.

schema_rules:
  - Catalog tables store current state only; historical migration records and
    command logs are not catalog tables.
  - Schema migration code is hardcoded in Python and tracks a mono catalog
    version with SQLite PRAGMA user_version.
  - Backend exposure settings live in config/exposures.yaml.
  - Embedding profile settings live in config/embeddings.yaml.
  - Full-text and semantic row shapes live in store_templates.yaml.
  - Command results, messages, logs, and summaries live under the caller cache
    root in results/ date folders.
  - Tables declare direct metadata entries and one-line physical columns.

datasets:
  - name: corpus_cache
    description: Current-state SQLite catalog for a regenerable evidence cache.
    dataset_role: regenerable_cache
    durability: current_control

    tables:
      - name: source_roots
        description: Caller-approved root scope. Usually one row for single-root CLI calls.
        exposures: [sqlite]
        columns:
          - {name: root_id, type: text, description: "Stable source-root ID derived from caller manifest data."}
          - {name: root_label, type: text, description: "Caller-supplied non-secret label."}
          - {name: source_kind, type: enum, description: "Source root kind.", values: [folder, archive, file, connector, synthetic_fixture]}
          - {name: source_uri, type: text, description: "Caller-provided path or URI, redacted in diagnostics by default."}
          - {name: policy_profile, type: text, description: "Caller policy profile used for this root."}
          - {name: first_seen_at, type: timestamp, description: "UTC timestamp when this root was first seen."}
          - {name: last_seen_at, type: timestamp, description: "UTC timestamp when this root was last seen."}
        indexes:
          - name: pk_source_roots
            columns: [root_id]
            unique: true

      - name: source_items
        description: Current files, archive members, or connector objects discovered under roots.
        exposures: [sqlite]
        columns:
          - {name: source_item_id, type: text, description: "Stable source item ID."}
          - {name: root_id, type: text, description: "Parent source root.", ref: corpus_cache.source_roots.root_id}
          - {name: parent_source_item_id, type: text, description: "Parent item for archive members or derived items.", ref: corpus_cache.source_items.source_item_id}
          - {name: relative_path, type: text, description: "Root-relative path when available."}
          - {name: source_uri, type: text, description: "Original path or URI."}
          - {name: item_kind, type: enum, description: "Source item kind.", values: [file, folder, archive_member, connector_object]}
          - {name: media_type, type: text, description: "MIME type or inferred media type."}
          - {name: size_bytes, type: integer, description: "Source item size in bytes."}
          - {name: source_mtime, type: timestamp, description: "Source modification timestamp, if known."}
          - {name: source_sha256, type: text, description: "SHA-256 hash of source bytes when available."}
          - {name: inventory_status, type: enum, description: "Current inventory state.", values: [current, unchanged, changed, missing, deleted, deferred, failed]}
        indexes:
          - name: pk_source_items
            columns: [source_item_id]
            unique: true
          - name: idx_source_items_root_path
            columns: [root_id, relative_path]

      - name: source_root_stats
        description: Current aggregate source inventory statistics per root.
        exposures: [sqlite]
        columns:
          - {name: root_id, type: text, description: "Source root being summarized.", ref: corpus_cache.source_roots.root_id}
          - {name: scope_id, type: text, description: "Root index scope summarized by this row.", ref: corpus_cache.index_scopes.scope_id}
          - {name: computed_at, type: timestamp, description: "UTC timestamp for the latest scan statistics."}
          - {name: folder_count, type: integer, description: "Current folders seen for the root."}
          - {name: file_count, type: integer, description: "Current matched files for the root."}
          - {name: skipped_unmatched_count, type: integer, description: "Files skipped by include rules in the latest scan."}
          - {name: failed_path_count, type: integer, description: "Paths that failed stat or hash in the latest scan."}
          - {name: total_size_bytes, type: integer, description: "Total bytes across current matched files."}
          - {name: average_file_size_bytes, type: real, description: "Average size across current matched files."}
          - {name: min_file_size_bytes, type: integer, description: "Smallest matched file size."}
          - {name: max_file_size_bytes, type: integer, description: "Largest matched file size."}
          - {name: stats_status, type: enum, description: "Current statistics state.", values: [current, deferred, failed]}
        indexes:
          - name: pk_source_root_stats
            columns: [root_id]
            unique: true

      - name: source_extension_stats
        description: Current aggregate source inventory statistics per file extension and root.
        exposures: [sqlite]
        columns:
          - {name: root_id, type: text, description: "Source root being summarized.", ref: corpus_cache.source_roots.root_id}
          - {name: extension, type: text, description: "Normalized lowercase extension, with [none] for no extension."}
          - {name: media_type, type: text, description: "Dominant or representative media type for this extension."}
          - {name: file_count, type: integer, description: "Current matched file count for this extension."}
          - {name: total_size_bytes, type: integer, description: "Total bytes for this extension."}
          - {name: average_file_size_bytes, type: real, description: "Average file size for this extension."}
          - {name: min_file_size_bytes, type: integer, description: "Smallest matched file size for this extension."}
          - {name: max_file_size_bytes, type: integer, description: "Largest matched file size for this extension."}
          - {name: computed_at, type: timestamp, description: "UTC timestamp for the latest scan statistics."}
        indexes:
          - name: pk_source_extension_stats
            columns: [root_id, extension]
            unique: true
          - name: idx_source_extension_stats_count
            columns: [root_id, file_count]
          - name: idx_source_extension_stats_size
            columns: [root_id, total_size_bytes]

      - name: documents
        description: Current document parse state for source items.
        exposures: [sqlite]
        columns:
          - {name: doc_id, type: text, description: "Stable document ID for the source item lineage."}
          - {name: source_item_id, type: text, description: "Current source item for this document.", ref: corpus_cache.source_items.source_item_id}
          - {name: source_sha256, type: text, description: "Current source content SHA-256 used for freshness."}
          - {name: parser_profile, type: text, description: "Parser profile used for the current parse."}
          - {name: parse_status, type: enum, description: "Current parser state.", values: [planned, parsed, unchanged, stale, deferred, failed]}
          - {name: parsed_at, type: timestamp, description: "UTC timestamp when the current parse completed."}
          - {name: title, type: text, description: "Best available document title."}
          - {name: language, type: text, description: "Best available document language code."}
          - {name: object_count, type: integer, description: "Current normalized object count."}
          - {name: valuable_item_count, type: integer, description: "Current valuable item count."}
        indexes:
          - name: pk_documents
            columns: [doc_id]
            unique: true
          - name: idx_documents_source
            columns: [source_item_id]

      - name: docling_artifacts
        description: Current Docling and derived artifacts for documents.
        exposures: [sqlite, file]
        columns:
          - {name: artifact_id, type: text, description: "Stable artifact ID."}
          - {name: doc_id, type: text, description: "Owning document.", ref: corpus_cache.documents.doc_id}
          - {name: artifact_kind, type: enum, description: "Artifact kind.", values: [docling_json, docling_yaml, markdown, text, html, doctags, page_image, extracted_asset]}
          - {name: artifact_uri, type: text, description: "Cache-root-relative artifact path, if file-backed."}
          - {name: blob_id, type: text, description: "Blob row containing payload or external pointer.", ref: corpus_cache.artifact_blobs.blob_id}
          - {name: content_sha256, type: text, description: "SHA-256 hash of artifact bytes."}
          - {name: storage_mode, type: enum, description: "How artifact bytes are stored.", values: [inline_blob, external_file, external_uri]}
          - {name: artifact_status, type: enum, description: "Current artifact state.", values: [current, stale, deleted, failed]}
        indexes:
          - name: pk_docling_artifacts
            columns: [artifact_id]
            unique: true
          - name: idx_docling_artifacts_doc_kind
            columns: [doc_id, artifact_kind]

      - name: artifact_blobs
        description: Inline or external artifact payloads with content hashes.
        exposures: [sqlite, file]
        columns:
          - {name: blob_id, type: text, description: "Stable blob ID."}
          - {name: sha256, type: text, description: "SHA-256 hash identifying the payload."}
          - {name: size_bytes, type: integer, description: "Payload size in bytes before compression."}
          - {name: storage_mode, type: enum, description: "Payload storage mode.", values: [inline_blob, external_file]}
          - {name: compression, type: enum, description: "Compression applied to stored payload.", values: [none, gzip, zstd]}
          - {name: relative_uri, type: text, description: "External file path relative to cache root."}
          - {name: payload, type: blob, description: "Inline payload for small artifacts."}
          - {name: first_seen_at, type: timestamp, description: "UTC timestamp when first observed."}
          - {name: last_seen_at, type: timestamp, description: "UTC timestamp when last observed."}
        indexes:
          - name: pk_artifact_blobs
            columns: [blob_id]
            unique: true
          - name: idx_artifact_blobs_sha256
            columns: [sha256]
            unique: true

      - name: document_objects
        description: Current normalized Docling objects before indexing chunk generation.
        exposures: [sqlite]
        columns:
          - {name: object_id, type: text, description: "Stable object ID."}
          - {name: doc_id, type: text, description: "Owning document.", ref: corpus_cache.documents.doc_id}
          - {name: parent_object_id, type: text, description: "Parent object in the document hierarchy.", ref: corpus_cache.document_objects.object_id}
          - {name: object_type, type: enum, description: "First approved normalized object set.", values: [page, section, paragraph, table, figure, diagram, image, chart, formula, codeblock, list, caption]}
          - {name: order_index, type: integer, description: "Reading-order position inside the document or parent."}
          - {name: page_start, type: integer, description: "First page number, one-based when known."}
          - {name: page_end, type: integer, description: "Last page number, one-based when known."}
          - {name: heading_path, type: text, description: "JSON list or delimiter-joined heading path."}
          - {name: text_preview, type: text, description: "Short normalized preview for diagnostics."}
          - {name: attrs_json, type: json, description: "Object metadata such as bbox, confidence, language, row counts, or code language."}
        indexes:
          - name: pk_document_objects
            columns: [object_id]
            unique: true
          - name: idx_document_objects_doc_type
            columns: [doc_id, object_type]

      - name: valuable_items
        description: Current high-value document items surfaced from normalized objects.
        exposures: [sqlite]
        columns:
          - {name: item_id, type: text, description: "Stable valuable item ID."}
          - {name: doc_id, type: text, description: "Owning document.", ref: corpus_cache.documents.doc_id}
          - {name: object_id, type: text, description: "Primary source object.", ref: corpus_cache.document_objects.object_id}
          - {name: item_type, type: enum, description: "Valuable item type.", values: [table, figure, diagram, image, chart, signature, form, receipt, clause, code, formula, other]}
          - {name: item_name, type: text, description: "Short item name or label."}
          - {name: item_description, type: text, description: "Redaction-safe item description."}
          - {name: confidence, type: real, description: "Extraction or classification confidence when available."}
          - {name: review_status, type: enum, description: "Current review state.", values: [unreviewed, accepted, rejected, deferred]}
          - {name: attrs_json, type: json, description: "Additional item metadata."}
        indexes:
          - name: pk_valuable_items
            columns: [item_id]
            unique: true
          - name: idx_valuable_items_doc_type
            columns: [doc_id, item_type]

      - name: index_scopes
        description: Current indexing scopes used to group lower FTS and semantic islands.
        exposures: [sqlite]
        columns:
          - {name: scope_id, type: text, description: "Stable scope ID."}
          - {name: root_id, type: text, description: "Source root for the scope.", ref: corpus_cache.source_roots.root_id}
          - {name: source_item_id, type: text, description: "Folder or source item owning this scope, if applicable.", ref: corpus_cache.source_items.source_item_id}
          - {name: scope_kind, type: enum, description: "Scope type.", values: [root, folder, archive, specialist]}
          - {name: relative_path, type: text, description: "Root-relative folder or scope path."}
          - {name: status, type: enum, description: "Current scope state.", values: [active, stale, deferred, deleted]}
          - {name: updated_at, type: timestamp, description: "UTC timestamp when this scope state last changed."}
        indexes:
          - name: pk_index_scopes
            columns: [scope_id]
            unique: true
          - name: idx_index_scopes_root_path
            columns: [root_id, relative_path]

      - name: summary_nodes
        description: Current lossy representative nodes used only for routing.
        exposures: [sqlite]
        columns:
          - {name: summary_id, type: text, description: "Stable summary node ID."}
          - {name: root_id, type: text, description: "Summarized source root.", ref: corpus_cache.source_roots.root_id}
          - {name: scope_id, type: text, description: "Summarized index scope.", ref: corpus_cache.index_scopes.scope_id}
          - {name: parent_summary_id, type: text, description: "Parent summary node when a hierarchy exists.", ref: corpus_cache.summary_nodes.summary_id}
          - {name: source_item_id, type: text, description: "Folder, file, or container item summarized when applicable.", ref: corpus_cache.source_items.source_item_id}
          - {name: doc_id, type: text, description: "Document summarized when applicable.", ref: corpus_cache.documents.doc_id}
          - {name: kind, type: enum, description: "Representative kind.", values: [root_summary, folder_summary, document_summary, album_summary, media_cluster_summary, negative_summary]}
          - {name: modality, type: enum, description: "Dominant modality represented.", values: [text, image, video, audio, model3d, mixed]}
          - {name: media_kind, type: text, description: "Closed media-kind label when applicable."}
          - {name: container_kind, type: enum, description: "Container shape when applicable.", values: [none, root, folder, document, item, cluster]}
          - {name: summary_level, type: integer, description: "Routing level, with 0 for root-level representatives."}
          - {name: title, type: text, description: "Short display title for the representative."}
          - {name: summary_text, type: text, description: "Local lossy LLM summary of sampled inputs."}
          - {name: routing_text, type: text, description: "Searchable routing text: summary plus deterministic facets."}
          - {name: source_refs_json, type: json, description: "Canonical refs sampled or represented by this node."}
          - {name: source_count, type: integer, description: "Total lower items considered for this representative."}
          - {name: sample_count, type: integer, description: "Lower items sampled into the summary prompt."}
          - {name: coverage_estimate, type: real, description: "sample_count divided by source_count when known."}
          - {name: sample_policy, type: text, description: "Sampling policy name."}
          - {name: producer, type: text, description: "Producer implementation or local model family."}
          - {name: profile, type: text, description: "Summary/profile configuration used."}
          - {name: source_high_watermark, type: text, description: "Hash of source inputs, config, and producer profile."}
          - {name: summary_status, type: enum, description: "Current summary state.", values: [current, stale, deferred, failed, deleted]}
          - {name: confidence, type: real, description: "Optional producer confidence or quality estimate."}
          - {name: importance, type: real, description: "Routing importance in [0,1]; higher earns more representation budget in the next layer."}
          - {name: attrs_json, type: json, description: "Additional routing metadata and diagnostics."}
          - {name: created_at, type: timestamp, description: "UTC timestamp when first generated."}
          - {name: updated_at, type: timestamp, description: "UTC timestamp when last refreshed."}
        indexes:
          - name: pk_summary_nodes
            columns: [summary_id]
            unique: true
          - name: idx_summary_nodes_root_kind
            columns: [root_id, kind]
          - name: idx_summary_nodes_scope_kind
            columns: [scope_id, kind]
          - name: idx_summary_nodes_parent
            columns: [parent_summary_id]
          - name: idx_summary_nodes_status
            columns: [summary_status]

      - name: fts_indexes
        description: Current registry of physical full-text index islands.
        exposures: [sqlite, fts]
        columns:
          - {name: fts_index_id, type: text, description: "Stable FTS index registry ID."}
          - {name: scope_id, type: text, description: "Catalog scope indexed by this island.", ref: corpus_cache.index_scopes.scope_id}
          - {name: fts_profile, type: text, description: "Configured FTS schema/tokenizer profile name."}
          - {name: chunk_profile, type: text, description: "Chunking profile used to generate FTS rows."}
          - {name: template_name, type: text, description: "Store template used for generated FTS rows."}
          - {name: index_uri, type: text, description: "Workspace-root-relative FTS directory."}
          - {name: indexed_chunk_count, type: integer, description: "Number of generated chunk rows indexed."}
          - {name: source_high_watermark, type: text, description: "Source hash or generation watermark last indexed."}
          - {name: status, type: enum, description: "Current FTS island state.", values: [planned, current, stale, rebuilding, deferred, failed, deleted]}
          - {name: updated_at, type: timestamp, description: "UTC timestamp when this FTS index state last changed."}
        indexes:
          - name: pk_fts_indexes
            columns: [fts_index_id]
            unique: true
          - name: idx_fts_indexes_scope
            columns: [scope_id]

      - name: semantic_stores
        description: Current registry of physical semantic vector store islands.
        exposures: [sqlite, semantic]
        columns:
          - {name: semantic_store_id, type: text, description: "Stable semantic store registry ID."}
          - {name: scope_id, type: text, description: "Catalog scope indexed by this island.", ref: corpus_cache.index_scopes.scope_id}
          - {name: embedding_profile, type: text, description: "Embedding profile used for generated semantic rows."}
          - {name: chunk_profile, type: text, description: "Chunking profile used to generate semantic rows."}
          - {name: template_name, type: text, description: "Store template used for generated semantic rows."}
          - {name: store_uri, type: text, description: "Workspace-root-relative semantic store directory."}
          - {name: table_name, type: text, description: "Semantic store table name containing generated chunk rows."}
          - {name: vector_dimension, type: integer, description: "Expected vector dimension."}
          - {name: indexed_chunk_count, type: integer, description: "Number of generated chunk rows embedded."}
          - {name: source_high_watermark, type: text, description: "Source hash or generation watermark last indexed."}
          - {name: status, type: enum, description: "Current semantic island state.", values: [planned, current, stale, rebuilding, deferred, failed, deleted]}
          - {name: updated_at, type: timestamp, description: "UTC timestamp when this semantic store state last changed."}
        indexes:
          - name: pk_semantic_stores
            columns: [semantic_store_id]
            unique: true
          - name: idx_semantic_stores_scope
            columns: [scope_id]

      - name: media_assets
        description: Current generic media assets derived from inventoried source items.
        exposures: [sqlite]
        columns:
          - {name: asset_id, type: text, description: "Stable media asset ID."}
          - {name: source_item_id, type: text, description: "Source item this asset is derived from.", ref: corpus_cache.source_items.source_item_id}
          - {name: media_class, type: enum, description: "Broad media modality.", values: [image, video, audio, model3d, other]}
          - {name: primary_artifact_id, type: text, description: "Primary generated preview/thumbnail artifact.", ref: corpus_cache.media_artifacts.artifact_id}
          - {name: inspect_status, type: enum, description: "Metadata extraction state.", values: [pending, current, failed, deferred]}
          - {name: attrs_json, type: json, description: "Additional generic asset metadata."}
          - {name: updated_at, type: timestamp, description: "UTC timestamp when this asset state last changed."}
        indexes:
          - name: pk_media_assets
            columns: [asset_id]
            unique: true
          - name: idx_media_assets_source_item
            columns: [source_item_id]
          - name: idx_media_assets_class
            columns: [media_class]

      - name: image_metadata
        description: Current deterministic metadata extracted from image assets.
        exposures: [sqlite]
        columns:
          - {name: asset_id, type: text, description: "Owning media asset.", ref: corpus_cache.media_assets.asset_id}
          - {name: format, type: text, description: "Image format such as JPEG, PNG, HEIC, WEBP."}
          - {name: width, type: integer, description: "Pixel width."}
          - {name: height, type: integer, description: "Pixel height."}
          - {name: megapixels, type: real, description: "Resolution in megapixels."}
          - {name: color_mode, type: text, description: "Color mode such as RGB, RGBA, L, CMYK."}
          - {name: has_alpha, type: integer, description: "1 if the image has an alpha channel."}
          - {name: orientation, type: integer, description: "EXIF orientation tag when present."}
          - {name: dpi, type: real, description: "Dots per inch when present."}
          - {name: camera_make, type: text, description: "EXIF camera make."}
          - {name: camera_model, type: text, description: "EXIF camera model."}
          - {name: captured_at, type: timestamp, description: "EXIF capture timestamp when present."}
          - {name: gps_lat, type: real, description: "EXIF GPS latitude in decimal degrees."}
          - {name: gps_lon, type: real, description: "EXIF GPS longitude in decimal degrees."}
          - {name: gps_altitude, type: real, description: "EXIF GPS altitude in meters."}
          - {name: attrs_json, type: json, description: "Additional safe EXIF or header fields."}
        indexes:
          - name: pk_image_metadata
            columns: [asset_id]
            unique: true

      - name: video_metadata
        description: Current deterministic metadata extracted from video assets.
        exposures: [sqlite]
        columns:
          - {name: asset_id, type: text, description: "Owning media asset.", ref: corpus_cache.media_assets.asset_id}
          - {name: container, type: text, description: "Container format such as MP4, MOV, MKV."}
          - {name: video_codec, type: text, description: "Primary video codec."}
          - {name: audio_codec, type: text, description: "Primary audio codec when present."}
          - {name: width, type: integer, description: "Frame width in pixels."}
          - {name: height, type: integer, description: "Frame height in pixels."}
          - {name: duration_seconds, type: real, description: "Duration in seconds."}
          - {name: frame_rate, type: real, description: "Average frames per second."}
          - {name: bit_rate, type: integer, description: "Overall bit rate in bits per second."}
          - {name: captured_at, type: timestamp, description: "Container capture timestamp when present."}
          - {name: gps_lat, type: real, description: "Container GPS latitude when present."}
          - {name: gps_lon, type: real, description: "Container GPS longitude when present."}
          - {name: attrs_json, type: json, description: "Additional safe container metadata."}
        indexes:
          - name: pk_video_metadata
            columns: [asset_id]
            unique: true

      - name: model3d_metadata
        description: Current deterministic metadata extracted from 3D model assets.
        exposures: [sqlite]
        columns:
          - {name: asset_id, type: text, description: "Owning media asset.", ref: corpus_cache.media_assets.asset_id}
          - {name: format, type: text, description: "3D format such as OBJ, STL, GLTF, GLB, PLY."}
          - {name: vertex_count, type: integer, description: "Number of vertices."}
          - {name: face_count, type: integer, description: "Number of faces."}
          - {name: has_normals, type: integer, description: "1 if normals are present."}
          - {name: has_uv, type: integer, description: "1 if UV coordinates are present."}
          - {name: has_color, type: integer, description: "1 if vertex or material color is present."}
          - {name: bbox_min, type: text, description: "Bounding box minimum as a JSON [x, y, z] list."}
          - {name: bbox_max, type: text, description: "Bounding box maximum as a JSON [x, y, z] list."}
          - {name: units, type: text, description: "Declared units when known."}
          - {name: attrs_json, type: json, description: "Additional safe model metadata."}
        indexes:
          - name: pk_model3d_metadata
            columns: [asset_id]
            unique: true

      - name: media_artifacts
        description: Current generated media artifacts such as thumbnails and previews.
        exposures: [sqlite]
        columns:
          - {name: artifact_id, type: text, description: "Stable media artifact ID."}
          - {name: asset_id, type: text, description: "Owning media asset.", ref: corpus_cache.media_assets.asset_id}
          - {name: artifact_kind, type: enum, description: "Generated artifact kind.", values: [thumbnail, preview, frame, render]}
          - {name: blob_id, type: text, description: "Stored artifact bytes in the shared blob store.", ref: corpus_cache.artifact_blobs.blob_id}
          - {name: width, type: integer, description: "Artifact pixel width when applicable."}
          - {name: height, type: integer, description: "Artifact pixel height when applicable."}
          - {name: attrs_json, type: json, description: "Additional artifact metadata."}
        indexes:
          - name: pk_media_artifacts
            columns: [artifact_id]
            unique: true
          - name: idx_media_artifacts_asset
            columns: [asset_id]

      - name: media_observations
        description: Current generated non-deterministic media observations such as captions, kinds, and tags.
        exposures: [sqlite]
        columns:
          - {name: observation_id, type: text, description: "Stable observation ID."}
          - {name: asset_id, type: text, description: "Observed media asset.", ref: corpus_cache.media_assets.asset_id}
          - {name: observation_kind, type: enum, description: "Generated observation kind.", values: [caption, media_kind, tag, label]}
          - {name: value_text, type: text, description: "Free-text caption, single media-kind label, tag, or object label."}
          - {name: confidence, type: real, description: "Model confidence when available."}
          - {name: producer, type: text, description: "Producing model or pipeline name."}
          - {name: profile, type: text, description: "Profile used to generate the observation."}
          - {name: attrs_json, type: json, description: "Additional observation metadata."}
          - {name: created_at, type: timestamp, description: "UTC timestamp when this observation was generated."}
        indexes:
          - name: pk_media_observations
            columns: [observation_id]
            unique: true
          - name: idx_media_observations_asset_kind
            columns: [asset_id, observation_kind]

      - name: image_stores
        description: Current registry of physical image-embedding vector store islands.
        exposures: [sqlite, semantic]
        columns:
          - {name: image_store_id, type: text, description: "Stable image store registry ID."}
          - {name: scope_id, type: text, description: "Catalog scope indexed by this island.", ref: corpus_cache.index_scopes.scope_id}
          - {name: image_profile, type: text, description: "Image embedding profile used for generated rows."}
          - {name: store_uri, type: text, description: "Workspace-root-relative image store directory."}
          - {name: table_name, type: text, description: "Image store table name containing generated asset rows."}
          - {name: vector_dimension, type: integer, description: "Expected image vector dimension."}
          - {name: indexed_asset_count, type: integer, description: "Number of media assets embedded."}
          - {name: source_high_watermark, type: text, description: "Asset or generation watermark last indexed."}
          - {name: status, type: enum, description: "Current image store state.", values: [planned, current, stale, rebuilding, deferred, failed, deleted]}
          - {name: updated_at, type: timestamp, description: "UTC timestamp when this image store state last changed."}
        indexes:
          - name: pk_image_stores
            columns: [image_store_id]
            unique: true
          - name: idx_image_stores_scope
            columns: [scope_id]

      - name: media_dedupe_candidates
        description: Current near-duplicate media candidate pairs surfaced for review.
        exposures: [sqlite]
        columns:
          - {name: candidate_id, type: text, description: "Stable candidate pair ID."}
          - {name: asset_id_a, type: text, description: "First asset in the candidate pair.", ref: corpus_cache.media_assets.asset_id}
          - {name: asset_id_b, type: text, description: "Second asset in the candidate pair.", ref: corpus_cache.media_assets.asset_id}
          - {name: method, type: enum, description: "Similarity method.", values: [phash, dhash, ahash, frame_phash]}
          - {name: distance, type: real, description: "Distance score; lower means more similar."}
          - {name: attrs_json, type: json, description: "Additional candidate metadata."}
        indexes:
          - name: pk_media_dedupe_candidates
            columns: [candidate_id]
            unique: true
          - name: idx_media_dedupe_candidates_a
            columns: [asset_id_a]
